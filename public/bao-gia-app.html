):", "", "", "", "", "", "", "", "", "52.1089", "m³"], ["Hao hụt thi công (nhập %):", "", "", "", "", "", "", "", "", "0.05", ""], ["⑪ BT lót cần ĐẶT MUA (đã cộng hao hụt):", "", "", "", "", "", "", "", "", "3.9051", "m³"], ["⑫ BT mác 250 cần ĐẶT MUA (đã cộng hao hụt):", "", "", "", "", "", "", "", "", "54.7144", "m³"], ["GHI CHÚ & CÔNG THỨC:", "", "", "", "", "", "", "", "", "", ""], ["• Khối hộp (lót, đế, cổ cột, đà kiềng, dầm):  KL = Số lượng × Dài(cạnh a) × Rộng(cạnh b) × Cao/dày.", "", "", "", "", "", "", "", "", "", ""], ["• Phần vát – chóp cụt:  KL = SL × (Cao/6) × [a·b + (a+a₂)(b+b₂) + a₂·b₂]  (a,b = đáy; a₂,b₂ = đỉnh).", "", "", "", "", "", "", "", "", "", ""], ["• Đà kiềng: cột \"Dài/cạnh a\" = chiều dài L của dầm lấy theo bản vẽ chi tiết.", "", "", "", "", "", "", "", "", "", ""], ["• Móng tường XÂY BỜ LÔ (VXM 75#) + lót đá 2×4 M100 dưới đà kiềng, và CỘT CG1: là hạng mục riêng (khối xây / cột thân) — KHÔNG có trong sheet này.", "", "", "", "", "", "", "", "", "", ""], ["• Đã chốt: đà kiềng mác 250; D1-1 lấy 6,0m/cây theo trục; đỉnh vát móng đôi M3/M4 giữ theo ước lượng (đã duyệt).", "", "", "", "", "", "", "", "", "", ""], ["• Cột: C1×6 (20×20), C2×1 (20×20), C3×2 & C4×2 (20×30), CR×2 hiên (20×20). Cao tầng 1=3,90m, tầng 2=3,65m. Cần xác nhận: C4 khu WC đáy -0.45.", "", "", "", "", "", "", "", "", "", ""], ["• SÀN T2 (trừ dần): phủ bì 16,75×6,0=100,5m² − ô giữa 6,71 − ban công trục B 5,17 − ô trục A 1,28 = 87,3m² → 10,48 m³.", "", "", "", "", "", "", "", "", "", ""], ["• SÀN MÁI (\"có thép = có sàn\", theo MB bố trí thép lớp dưới): V1 dải trục1→1* 1,35×5,80=7,83m²; V2 dải B*→B trục2→4 9,26×1,49=13,80m²; V3 đua công-xôn sau trục4 1,31×4,31=5,65m². Tổng ~27,3m² → 3,27 m³. Sân thượng hở (các ô gạch chéo, không thép) KHÔNG có sàn.", "", "", "", "", "", "", "", "", "", ""], ["• CẦU THANG: bậc XÂY GẠCH THẺ (VXM M100) nên KHÔNG có trong BT — sẽ nằm ở hạng mục khối xây. BT thang = bản nghiêng 3 vế + 2 chiếu nghỉ + dầm DT-1 (~0,84 m³ mác 250). Bề rộng vế/chiếu nghỉ & chiều dài DT-1 lấy ước lượng — ANH KIỂM TRA.", "", "", "", "", "", "", "", "", "", ""], ["• CỘT PHỤ CG1: bê tông 11×20cm, 2 cột × 2 tầng ~0,33 m³ (đã xác nhận), khớp với thép CG1 ở sheet sat_thep.", "", "", "", "", "", "", "", "", "", ""]]}, "sat_thep": {"title": "BẢNG DỰ TOÁN KHỐI LƯỢNG CỐT THÉP (SẮT THÉP)", "cols": 9, "rows": [["BẢNG DỰ TOÁN KHỐI LƯỢNG CỐT THÉP (SẮT THÉP)", "", "", "", "", "", "", "", ""], ["Công trình: Nhà anh Tâm – Phước Thái  |  Nguồn: BẢNG THỐNG KÊ CỐT THÉP trong HSKC (bản vẽ gốc). Trọng lượng net = Chiều dài × Đơn trọng (D²/162). Cuối bảng cộng hao hụt & quy ra số cây.", "", "", "", "", "", "", "", ""], ["Ô nền VÀNG = số nhập từ bản vẽ (sửa được). Trọng lượng & Số cây = công thức. Ø6/Ø8 thép cuộn (bán theo kg); Ø≥10 quy cây 11,7m.", "", "", "", "", "", "", "", ""], ["STT", "Nội dung / Hạng mục", "ĐVT", "Ø\n(mm)", "Chiều dài\nnet (m)", "Đơn trọng\n(kg/m)", "Trọng lượng\nnet (kg)", "Số cây\n(theo BV)", "Ghi chú / Nguồn"], ["PHẦN 1 — MÓNG (M1–M5)  [KC-06]", "", "", "", "", "", "", "", ""], ["   → Thép đế móng & vát. Ø10 chịu lực, Ø12 gia cường.", "", "", "", "", "", "", "", ""], [1, "Thép Ø10", "kg", 10, "307.1", "0.617", "189.4807", 28, "Móng M1–M5, thép Ø10"], [2, "Thép Ø12", "kg", 12, "153.6", "0.888", "136.3968", 14, "Móng M1, M4 – Ø12"], ["Cộng PHẦN 1:", "", "", "", "", "", "325.8775", "", ""], ["PHẦN 2 — MÓNG TƯỜNG + ĐÀ KIỀNG / GIẰNG (MT1–MT8, D1-1…D1-6, DCT, CG1)  [KC-07]", "", "", "", "", "", "", "", ""], ["   → Gộp móng tường (MT1–MT8) + dầm giằng (D1) + DCT + CG1. Ø6 đai, Ø14/Ø16 thép dọc.", "", "", "", "", "", "", "", ""], [1, "Thép Ø6", "kg", 6, "718.5", "0.222", "159.507", "cuộn", "Đai Ø6 (thép cuộn)"], [2, "Thép Ø10", "kg", 10, "16.8", "0.617", "10.3656", 2, "CG1 – Ø10"], [3, "Thép Ø12", "kg", 12, "28.5", "0.888", "25.308", 3, "D1-4, MT4 – Ø12"], [4, "Thép Ø14", "kg", 14, "109.6", "1.208", "132.3968", 10, "MT2/MT7/MT8 – Ø14"], [5, "Thép Ø16", "kg", 16, "346.1", "1.578", "546.1458", 32, "MT1/3/6, D1-1…5 – Ø16"], [6, "Thép Ø16", "]]}, "mai_ton": {"title": "BẢNG DỰ TOÁN MÁI TÔN & XÀ GỒ", "cols": 9, "rows": [["BẢNG DỰ TOÁN MÁI TÔN & XÀ GỒ", "", "", "", "", "", "", "", ""], ["Công trình: Nhà anh Tâm – Phước Thái  |  Mái tôn i=2% trên sàn mái BTCT (KT-11). Bóc: diện tích tôn (m²) + xà gồ (m & kg).", "", "", "", "", "", "", "", ""], ["Ô nền VÀNG = số nhập/giả định (sửa được). Nền CAM = ước lượng, anh kiểm tra. Cột Khối lượng = công thức.", "", "", "", "", "", "", "", ""], ["STT", "Hạng mục / Diễn giải", "ĐVT", "Số lượng\n/ hệ số", "Dài\n(m)", "Rộng\n(m)", "Đơn trọng\n(kg/m)", "Khối lượng", "Ghi chú"], ["PHẦN 1 — MÁI TÔN  (tôn lạnh/mạ màu, dày ~0,45mm; i=2%)", "", "", "", "", "", "", "", ""], ["   → Diện tích phủ = Dài × Rộng vùng mái tôn (KT-11). Dốc 2% xem như phẳng. Cộng thêm % chồng mí + hao cắt.", "", "", "", "", "", "", "", ""], [1, "Diện tích phủ mái tôn (chính)", "m²", "", "13.6", "5.8", "", "78.88", "Vùng mái tôn chính 13,60×5,80m (theo MB mái KT-11). Đo lại nếu cần."], [2, "Hệ số chồng mí sóng tôn + hao cắt (nhập %)", "", "0.1", "", "", "", "", "Chồng mí + hao ~10% (sửa được). Tôn sóng thường +8–12%."], [3, "MÁI TÔN CẦN MUA", "m²", "", "", "", "", "86.768", "Diện tích tôn đặt mua (đã cộng chồng mí + hao)."], ["PHẦN 2 — XÀ GỒ MÁI  (thép hộp/C, đỡ tôn)", "", "", "", "", "", "", "", ""], ["   → Xà gồ chạy NGANG (mỗi cây ~ rộng mái), rải dọc chiều dài mái. SỐ XÀ GỒ chọn số lẻ phong thủy (13/17/21); KHOẢNG CÁCH tự tính = chiều dài rải ÷ (số−1), cần 0,9–1,1m (chỉnh chiều dài rải hoặc đổi số).", "", "", "", "", "", "", "", ""], [4, "Số xà gồ (số lẻ phong thủy: 13 / 17 / 21)", "cây", 17, "", "", "", "", "Chọn 13/17/21. Khoảng cách tự tính; chỉnh chiều dài rải để rơi vào 0,9–1,1m."], [5, "Chiều dài rải xà gồ (dọc mái, nhập m)", "m", "", 16, "", "", "", "≈ chiều dài mái (trải theo phương dài). Chỉnh để khoảng cách 0,9–1,1m."], [6, "Khoảng cách xà gồ (tự tính)", "m", "", "", "", "", 1, "Khoảng cách = Chiều dài rải ÷ (Số xà gồ − 1). Yêu cầu 0,9–1,1m."], [7, "Kiểm tra khoảng cách", "", "", "", "", "", "ĐẠT (0,9-1,1m)", "Tự báo ĐẠT hay cần chỉnh (17 cây × 16m = 1,00m: ĐẠT)."], [8, "Chiều dài 1 cây xà gồ (rộng mái + đua)", "m", "", 6, "", "", "", "Rộng mái ~5,8m + đua mép. Sửa nếu cần."], [9, "Tổng chiều dài xà gồ", "m", "", "", "", "", 102, "Tổng dài = Số xà gồ × dài 1 cây."], [10, "Đơn trọng xà gồ (nhập, kg/m)", "kg/m", "", "", "", "4.5", "", "Hộp 50×100×2,0 ~4,5; C150 ~4–5 kg/m."], [11, "KHỐI LƯỢNG XÀ GỒ", "kg", "", "", "", "", 459, "KL = Tổng dài × đơn trọng. Cộng ~5% nối/hao khi đặt."], [12, "Xà gồ biên / ke / giằng (ước lượng)", "kg", 1, "", "", "", 40, "Ước lượng ~40kg phụ kiện. Anh chỉnh."], ["TỔNG HỢP MÁI TÔN & XÀ GỒ", "", "", "", "", "", "", "", ""], ["① Mái tôn cần mua:", "", "", "", "", "", "", "86.768", "m²"], ["② Xà gồ mái (chính + biên):", "", "", "", "", "", "", 499, "kg"], ["GHI CHÚ:", "", "", "", "", "", "", "", ""], ["• Diện tích mái tôn chính 13,60×5,80m ≈ 78,9 m² đo từ MB mái KT-11 — anh kiểm tra lại (có phần lùi/notch góc phải).", "", "", "", "", "", "", "", ""], ["• Dốc mái i=2% (gần phẳng) nên diện tích nghiêng ≈ diện tích bằng. Chồng mí sóng + hao cắt để 10%.", "", "", "", "", "", "", "", ""], ["• Xà gồ: SỐ CÂY chọn số lẻ phong thủy (13/17/21). Khoảng cách tự tính = chiều dài rải ÷ (số−1), giữ trong 0,9–1,1m (ô Kiểm tra tự báo). Mặc định 17 cây, mái 16m → 1,00m. Đơn trọng 4,5 kg/m (hộp 50×100) — chỉnh theo loại thép.", "", "", "", "", "", "", "", ""], ["• CHƯA gồm: máng thu nước, cầu thu nước, ô thăm mái, viền diềm, vít bắn — tính thêm khi anh cần.", "", "", "", "", "", "", "", ""], ["• Bản vẽ không có mặt bằng bố trí xà gồ chi tiết → số hàng tính theo khoảng cách. Nếu có bản vẽ kết cấu mái tôn thì bóc theo đó chính xác hơn.", "", "", "", "", "", "", "", ""]]}, "chong_tham": {"title": "BẢNG DỰ TOÁN CHỐNG THẤM (PHẦN THÔ)", "cols": 7, "rows": [["BẢNG DỰ TOÁN CHỐNG THẤM (PHẦN THÔ)", "", "", "", "", "", ""], ["Công trình: Nhà anh Tâm – Phước Thái  |  Chống thấm: nền WC tầng 2, tường WC 2 tầng (cao 1,2m), sàn mái BTCT. Diện tích = Dài/Chu vi    <div class="r2"><span class="k">Nhân công</span><span class="v">${num('hoanThien.'+i+'.von.nc',v.nc)}</span></div>
   <div class="r2"><span class="k">Vật tư phụ</span><span class="v">${num('hoanThien.'+i+'.von.vtPhu',v.vtPhu)}</span></div>
   <div class="r2"><span class="k"><b>Cộng giá vốn</b></span><span class="v"><span data-c="hv${i}">${fmt(htVon(i))}</span></span></div></div></div></div>
 ${klBlock('hoan_thien','Khối lượng hoàn thiện')}
 <div class="profit" id="pf"></div><p class="hint">Giá bán liên kết từ báo giá. Nhập giá vốn thật → lợi nhuận tự tính. Bật ✎ Sửa để chỉnh.</p>`);
 CALC['hv'+i]=()=>fmt(htVon(i));drawPf(i);window.scrollTo(0,0);}
function drawPf(i){const ban=htCong(i),von=htVon(i),loi=ban-von;const p=document.getElementById('pf');if(!p)return;
 p.className='profit'+(loi<0?' loss':'');p.innerHTML=`<div><div class="mini">Lợi nhuận · bán ${fmt(ban)} − vốn ${fmt(von)}</div><div class="amt">${fmt(loi)} đ</div></div><div class="pill ${loi>=0?'g':'r'}" style="font-size:15px">${pct(loi,ban).toFixed(1)}%</div>`;}

// ===== MAN "VAT TU HOAN THIEN" =====
// Copy man Hoan thien nhung quy ve GIA VON VAT TU: bo nhan cong va phan quan ly/lai.
// Dung de chot chung loai vat tu voi chu nha — doi loai nao thi bu tru theo don gia von.
// Von vat tu 1 hang muc = von.vt + von.vtPhu (khong lay von.nc).
function htVtVon(i){const m=DATA.hoanThien[i];
 if(Array.isArray(m.vtGia)&&m.vtGia.length)return m.vtGia.reduce((s,v)=>s+(+v.tt||0),0);
 const v=m.von||{};return (+v.vt||0)+(+v.vtPhu||0);}
// Sua SL hoac don gia von 1 dong vat tu -> tinh lai thanh tien roi refresh moi tong.
function ttVT(mi,vj){const v=DATA.hoanThien[mi].vtGia[vj];
 v.tt=Math.round((+v.kl||0)*(+v.gia||0));
 const el=document.getElementById('vtt_'+mi+'_'+vj); if(el)el.textContent=fmt(v.tt);
 saveLS(); calc();}
function htVtTotal(){return DATA.hoanThien.reduce((s,_,i)=>s+htVtVon(i),0);}
// Bang vat tu cua 1 hang muc, quy ve GIA VON.
// Uu tien m.vtGia (danh sach vat tu that: chung loai / SL / don gia von) — day moi la
// can cu bu tru khi khach doi chung loai. Neu hang muc chua co vtGia thi rai von ve
// tung dong chi phi theo ty trong thanh tien de van co so hien thi.
function costTableVon(m,mi){const von=htVtVon(mi);
 const head=`<thead><tr><th>Vật tư</th><th class="n">ĐVT</th><th class="n">SL</th><th class="n">Đơn giá vốn</th><th class="n">Thành tiền vốn</th></tr></thead>`;
 const cg=`<colgroup><col style="width:42%"><col style="width:9%"><col style="width:11%"><col style="width:18%"><col style="width:20%"></colgroup>`;
 const foot=()=>`<tr class="tot"><td>CỘNG VẬT TƯ HẠNG MỤC</td><td></td><td></td><td></td><td class="n"><span data-c="vv${mi}">${fmt(htVtVon(mi))}</span></td></tr>`;
 const vg=Array.isArray(m.vtGia)?m.vtGia:[];
 if(vg.length){
   // Gom nhom theo tien to [TEN NHOM] o dau ten vat tu (vd "[SƠN]", "[CHỐNG THẤM]").
   let cur=null,r='';
   vg.forEach((v,j)=>{const mt=/^\s*\[([^\]]+)\]\s*(.*)$/.exec(v.ten||'');
     const grp=mt?mt[1]:null, ten=mt?mt[2]:(v.ten||'');
     if(grp&&grp!==cur&&!EDIT){cur=grp;r+=`<tr class="grp"><td colspan="5">${grp}</td></tr>`;}
     const P='hoanThien.'+mi+'.vtGia.'+j;
     const cTen=EDIT?txt(P+'.ten',v.ten||''):ten;
     const cDvt=EDIT?txt(P+'.dvt',v.dvt||''):(v.dvt||'');
     const cKl=EDIT?`<input class="e num" value="${fmt(v.kl)}" oninput="setD('${P}.kl',pn(this.value));ttVT(${mi},${j})">`:(v.kl!=null?fmt(v.kl):'');
     const cGia=EDIT?`<input class="e num" value="${fmt(v.gia)}" oninput="setD('${P}.gia',pn(this.value));ttVT(${mi},${j})">`:(v.gia!=null?fmt(v.gia):'—');
     r+=`<tr><td>${cTen}</td><td class="n">${cDvt}</td><td class="n">${cKl}</td><td class="n">${cGia}</td><td class="n"><span id="vtt_${mi}_${j}">${fmt(v.tt||0)}</span></td></tr>`;});
   return `<table class="fx">${cg}${head}<tbody>${r}${foot()}</tbody></table>`;
 }
 const tt=c=>(c.kl!=null&&c.gia!=null?(+c.kl||0)*(+c.gia||0):(+c.tt||0));
 const tot=m.costs.reduce((s,c)=>s+tt(c),0);
 let r=m.costs.map(c=>{const share=tot>0?tt(c)/tot:(m.costs.length?1/m.costs.length:0);
   const vonLine=Math.round(von*share);const kl=(c.kl!=null&&+c.kl)?+c.kl:null;
   const dg=kl?Math.round(vonLine/kl):null;
   return `<tr><td>${c.stt!=null?c.stt+'. ':''}${c.label||''}</td><td class="n">${c.dvt||''}</td><td class="n">${c.kl!=null?fmt(c.kl):''}</td><td class="n">${dg!=null?fmt(dg):'—'}</td><td class="n">${fmt(vonLine)}</td></tr>`}).join('');
 return `<table class="fx">${cg}${head}<tbody>${r}${foot()}</tbody></table>`;}
function pageHTVT(){DATA.hoanThien.forEach((m,i)=>{CALC['vv'+i]=()=>fmt(htVtVon(i));});CALC['vvTot']=()=>fmt(htVtTotal());
 let c=DATA.hoanThien.map((m,i)=>`<div class="card mucCard" id="vt-${bgSlug(m.name)}"><div class="hd"><span class="nm">${i+1}. ${txt('hoanThien.'+i+'.name',m.name)}</span><span class="amt"><span data-c="vv${i}">${fmt(htVtVon(i))}</span></span></div><div class="bd">${costTableVon(m,i)}</div></div>`).join('');
 R(`<div class="sec-title">Vật tư hoàn thiện — ${DATA.hoanThien.length} hạng mục</div>
 <div class="hero"><div class="lab">Tổng giá vốn vật tư hoàn thiện</div><div class="big"><span data-c="vvTot">${fmt(htVtTotal())}</span> đ</div></div>
 <div class="dg">Bảng này là <b>giá vốn vật tư</b> — đã bỏ nhân công và chi phí quản lý. Dùng làm căn cứ <b>bù trừ khi đổi chủng loại vật tư</b>: lấy khối lượng nhân với chênh lệch đơn giá giữa loại cũ và loại mới.</div>
 <div class="sec-title" style="font-size:16px">Chi tiết vật tư theo hạng mục</div>${c}`);}

function pagePL(){const tb=thoBan(),tv=thoVon(),hb=htTotal(),hv=htVonTot();const ban=tb+hb,von=tv+hv,loi=ban-von;
 let rows=DATA.hoanThien.map((m,i)=>{const b=htCong(i),vo=htVon(i),l=b-vo;return `<tr><td>${i+1}. ${m.name}</td><td class="n">${fmt(b)}</td><td class="n">${fmt(vo)}</td><td class="n" style="color:${l>=0?'var(--green)':'var(--red)'}">${fmt(l)}</td><td class="n">${pct(l,b).toFixed(0)}%</td></tr>`}).join('');
 R(`<div class="sec-title">Phân tích lãi / lỗ toàn dự án</div>
 <div class="hero"><div class="lab">Lợi nhuận gộp dự kiến</div><div class="big" style="color:var(--green)"><span data-c="allLoi">${fmt(loi)}</span> đ</div>
  <div class="split"><div><div class="k">Tổng giá bán</div><div class="v"><span data-c="allBan">${fmt(ban)}</span></div></div>
  <div><div class="k">Tổng giá vốn</div><div class="v"><span data-c="allVon">${fmt(von)}</span></div></div>
  <div><div class="k">Biên lợi nhuận</div><div class="v">${pct(loi,ban).toFixed(1)}%</div></div></div></div>
 <div class="card"><div class="hd"><span class="nm">Phần thô</span></div><div class="bd">
  <div class="r2"><span class="k">Giá bán</span><span class="v">${fmt(tb)}</span></div>
  <div class="r2"><span class="k">Giá vốn (vật tư ${fmt(thoVt())} + nhân công ${fmt(DATA.thoNhanCong)})</span><span class="v">${fmt(tv)}</span></div>
  <div class="r2"><span class="k"><b>Lợi nhuận thô</b></span><span class="v" style="color:var(--green)">${fmt(tb-tv)} (${pct(tb-tv,tb).toFixed(1)}%)</span></div></div></div>
 <div class="card"><div class="hd"><span class="nm">Hoàn thiện — theo hạng mục</span></div><div class="bd">
  <table class="fx"><colgroup><col><col style="width:20%"><col style="width:20%"><col style="width:18%"><col style="width:10%"></colgroup>
  <thead><tr><th>Hạng mục</th><th class="n">Giá bán</th><th class="n">Giá vốn</th><th class="n">Lợi nhuận</th><th class="n">Biên</th></tr></thead>
  <tbody>${rows}<tr class="tot"><td>Tổng hoàn thiện</td><td class="n">${fmt(hb)}</td><td class="n">${fmt(hv)}</td><td class="n">${fmt(hb-hv)}</td><td class="n">${pct(hb-hv,hb).toFixed(0)}%</td></tr></tbody></table></div></div>
 <p class="hint">Giá vốn hoàn thiện đang ước tính — vào từng hạng mục nhập số thật để chính xác.</p>`);}

async function saveFile(){if(CONTRACT){await postVersion();toast('✓ Đã lưu + tạo phiên bản');return;}saveLS();document.getElementById('db').textContent=JSON.stringify(DATA);
 const root=document.getElementById('root');const keep=root.innerHTML;root.innerHTML='';
 const html='<!doctype html>\n<html lang="vi">'+document.documentElement.innerHTML+'</html>';root.innerHTML=keep;
 try{if(window.showSaveFilePicker){if(!fileHandle)fileHandle=await window.showSaveFilePicker({suggestedName:'He thong Bao gia - Du toan (a6).html',types:[{description:'HTML',accept:{'text/html':['.html']}}]});
   const w=await fileHandle.createWritable();await w.write(html);await w.close();toast('✓ Đã lưu vào file');return;}}catch(e){if(e.name==='AbortError')return;}
 const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='He thong Bao gia - Du toan (a6).html';a.click();toast('Đã tải file — kéo đè lên file cũ');}
function initMeta(){
{const _c={full:"CÔNG TY TNHH KIẾN TRÚC XÂY DỰNG VÀ NỘI THẤT HUỲNH GIA",slogan:"Xây Dựng Huỳnh Gia - Yên Tâm Nhận Nhà",diaChi:"2157 QL51, Phước Bình 1, Xã Phước Thái, TP. Đồng Nai",hotline:"0931.316.513",mst:"3604008952",web:"huynhgia6.com"};DATA.congty=DATA.congty||{};for(const k in _c){if(!DATA.congty[k]||String(DATA.congty[k]).charAt(0)==="[")DATA.congty[k]=_c[k];}}{const _d={cdt:"Anh Tâm",ct:"Nhà ở gia đình",dd:"Phước Thái, Long Thành, Đồng Nai",tang:"2 tầng",tg:"120 ngày"};DATA.duan=DATA.duan||{};for(const k in _d){if(!DATA.duan[k])DATA.duan[k]=_d[k];}}
if(!DATA.thanhToan||!DATA.thanhToan.length){DATA.thanhToan=[["Khi ký hợp đồng — tạm ứng",10],["Đổ bê tông móng & đà kiềng",20],["Đổ bê tông sàn tầng 2",15],["80% xây tô trát",15],["80% lợp mái tôn",15],["80% ốp lát & sơn nước",15],["Nghiệm thu bàn giao",9],["Bảo hành 1 năm",1]].map(function(p){return{label:p[0],ty:p[1]};});}
if(DATA._matSpec!==1&&DATA.thoHangMuc){DATA.thoHangMuc.forEach(function(h){(h.vt||[]).forEach(function(v){var t=v.ten||'';
 if(/^Cát/i.test(t))t='Cát vàng';
 else if(/^Gạch/i.test(t))t='Gạch tuynel';
 else if(/^Xà gồ/i.test(t))t='Xà gồ thép hộp mạ kẽm Hoa Sen 40×80×1,4';
 else if(/^Thép cây/i.test(t))t=t.replace(/^Thép cây (Ø\d+).*/,'Thép Việt Nhật $1');
 else if(/^Xi măng/i.test(t)&&!/Insee/i.test(t))t=/PCB40/.test(t)?t.replace('PCB40','Insee PCB40'):t.replace(/^Xi măng/,'Xi măng Insee PCB40');
 v.ten=t;});});DATA._matSpec=1;try{saveLS()}catch(e){}}
}
if(!CONTRACT)initMeta();
try{document.getElementById('logoImg').src=LOGO}catch(e){}
/* In đầy đủ: gom 4 mục khách hàng (Tổng quan + Phần thô + Hoàn thiện + Không bao gồm) vào 1 lần in,
   mỗi mục 1 trang. Bỏ mục "Lãi/lỗ" (nội bộ). bw=true ép chữ đen đậm cho máy in đen trắng. */
function printAll(bw){
 var root=document.getElementById('root');if(!root)return;
 var keep=root.innerHTML,keepCur=CUR;
 var order=['tq','tho','ht','kbg'],fns={tq:pageTQ,tho:pageTho,ht:pageHT,kbg:pageKBG},parts=[];
 order.forEach(function(p){try{fns[p]();}catch(e){}parts.push(root.innerHTML);});
 root.innerHTML=parts.map(function(h){return '<section class="print-sheet">'+h+'</section>';}).join('');
 if(bw)document.body.classList.add('bw');
 var done=function(){document.body.classList.remove('bw');root.innerHTML=keep;CUR=keepCur;if(window.requestAnimationFrame)requestAnimationFrame(fitSheet);window.removeEventListener('afterprint',done);};
 window.addEventListener('afterprint',done);setTimeout(done,3000);window.print();
}
function printBW(){document.body.classList.add('bw');var done=function(){document.body.classList.remove('bw');window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);setTimeout(done,2500);window.print();}
/* Menu in: gộp 4 kiểu in vào 1 nút xổ. 0=mục đang xem màu, 1=mục đang xem T.Đen, 2=đầy đủ màu, 3=đầy đủ T.Đen. */
function togglePrintMenu(e){if(e)e.stopPropagation();var m=document.getElementById('printMenu');if(m)m.classList.toggle('open');}
function pmDo(i){var m=document.getElementById('printMenu');if(m)m.classList.remove('open');var acts=[function(){window.print();},printBW,function(){printAll(false);},function(){printAll(true);}];setTimeout(function(){(acts[i]||acts[0])();},60);}
document.addEventListener('click',function(e){var m=document.getElementById('printMenu');if(m&&!m.contains(e.target))m.classList.remove('open');});
async function boot(){
  if(CONTRACT){
    try{
      const url=VERSION?('/api/admin/design-contracts/'+CONTRACT+'/quote/versions/'+VERSION)
                       :('/api/admin/design-contracts/'+CONTRACT+'/quote');
      const r=await fetch(url);
      if(r.ok){const j=await r.json();const qd=j&&(j.quoteData||j.data);if(qd){DATA=qd;normVon();initMeta();}else if(!VERSION){await putQuote();}}
    }catch(e){}
  }
  try{document.title=(DATA&&DATA.project)?('Báo giá — '+DATA.project):'Bảng báo giá';}catch(e){}
  if(RO){document.body.classList.add('ro');
    ['#editBtn','.nav button[data-p="pl"]','.nav button[onclick^="saveFile"]'].forEach(function(sel){var e=document.querySelector(sel);if(e)e.style.display='none';});
  }
  const GOTO=QP.get('goto');
  if(GOTO){nav('ht');const id='bg-'+bgSlug(GOTO);let n=0;const jump=()=>{const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}if(++n<5)setTimeout(jump,180);};setTimeout(jump,50);}
  else nav('tq');
}
boot();
window.addEventListener('resize',fitSheet);window.addEventListener('orientationchange',fitSheet);
if(window.ResizeObserver){new ResizeObserver(fitSheet).observe(document.getElementById('root'));}
fitSheet();
